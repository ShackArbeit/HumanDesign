
# ============================================================
# Workflow: CI (Continuous Integration)
#
# 目的：
# 1. 檢查前端 web 專案
# 2. 檢查後端 server 專案
# 3. 確認程式碼可以通過 Lint、Test 等檢查
# 4. 確認前端可以成功 Build
# ============================================================

name: CI

# 定義觸發 Workflow 的 GitHub 事件
on:
  # 當 Pull Request 建立、更新或重新開啟時觸發
  # 未指定 branches，因此不限制 PR 的目標分支
  pull_request:

  # 當程式碼 Push 時觸發
  push:
    # 只有推送到 main 分支時才觸發
    branches: [main]


# ============================================================
# Jobs：定義 Workflow 中要執行的工作
#
# web 與 server 是兩個獨立的 Job。
# 沒有設定 needs，因此預設可以平行執行。
# 每個 Job 都會使用自己的 Runner 執行環境。
# ============================================================

jobs:

  # ----------------------------------------------------------
  # Job 1：Frontend CI
  # 負責前端程式碼檢查、測試及建置
  # ----------------------------------------------------------
  web:

    # 指定 GitHub-hosted Runner 的作業系統環境
    runs-on: ubuntu-latest

    # 設定本 Job 中所有 run 指令的預設工作目錄
    # 注意：不影響 uses Action 的執行目錄
    defaults:
      run:
        working-directory: web

    steps:

      # Step 1：將目前 Repository 的程式碼 Checkout 到 Runner
      # 讓後續步驟可以存取 web/ 下的檔案
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2：設定 Node.js 執行環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 指定 Node.js 主版本
          node-version: 20

          # 啟用 npm 套件快取
          cache: npm

          # 指定用來識別 npm 依賴版本的 lockfile
          # 路徑相對於 Repository 根目錄
          cache-dependency-path: web/package-lock.json

      # Step 3：依照 package-lock.json 安裝相依套件
      # npm ci 適合 CI 環境，且不會修改 lockfile
      - name: Install dependencies
        run: npm ci

      # Step 4：執行 ESLint 等程式碼靜態檢查
      - name: Run lint
        run: npm run lint

      # Step 5：執行前端自動化測試
      - name: Run tests
        run: npm test

      # Step 6：建置前端正式環境版本
      # 例如 Vite 專案會產生 dist/ 資料夾
      - name: Build frontend
        run: npm run build


  # ----------------------------------------------------------
  # Job 2：Backend CI
  # 負責後端程式碼檢查與自動化測試
  # ----------------------------------------------------------
  server:

    # 指定 GitHub-hosted Runner 的作業系統環境
    runs-on: ubuntu-latest

    # 設定本 Job 中所有 run 指令的預設工作目錄
    defaults:
      run:
        working-directory: server

    steps:

      # Step 1：Checkout Repository 程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2：設定 Node.js 執行環境
      # 因為此處使用 npm 安裝 server 的 Node.js Dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Step 3：設定 Java 執行環境
      # 只有當後端工具、測試或建置流程確實需要 Java 時才需要
      # 例如使用 Java-based 工具或相關 Emulator
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Step 4：全域安裝 Firebase CLI
      # 讓後續步驟可以使用 firebase 指令
      # 若專案有鎖定 firebase-tools 版本，建議改用鎖定版本
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 5：安裝 server 相依套件
      - name: Install dependencies
        run: npm ci

      # Step 6：執行後端程式碼靜態檢查
      - name: Run lint
        run: npm run lint

      # Step 7：執行後端自動化測試
      - name: Run tests
        run: npm test
